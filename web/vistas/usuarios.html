<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Usuarios | Infracciones</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="../css/theme.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="dashboard.html">
                    <span class="brand-mark" aria-hidden="true"><i class="bi bi-shield-check"></i></span>
                    Infracciones
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                        aria-expanded="false" aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav mx-lg-auto">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="sanciones.html">Sanciones</a></li>
                        <li class="nav-item"><a class="nav-link active" href="usuarios.html" aria-current="page">Usuarios</a></li>
                    </ul>
                    <div class="session-actions d-flex align-items-center gap-3">
                        <span class="session-user"><i class="bi bi-person-circle"></i><span data-nombre-usuario></span></span>
                        <button class="btn btn-outline-light btn-sm logout-btn" type="button" data-cerrar-sesion>
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container">
            <div class="breadcrumb-label">
                <i class="bi bi-people" aria-hidden="true"></i>
                Panel de administración <span aria-hidden="true">/</span>
                <span class="text-dark">Usuarios</span>
            </div>
            <div class="page-heading">
                <div>
                    <h1>Usuarios</h1>
                    <p>Consulta las cuentas registradas y sus permisos dentro del sistema.</p>
                </div>
            </div>
            <div id="alerta" role="alert"></div>
            <section class="data-panel" aria-labelledby="usuarios-title">
                <div class="panel-header d-flex align-items-center justify-content-between gap-3">
                    <h2 id="usuarios-title">Usuarios registrados</h2>
                    <span class="status-badge"><i class="bi bi-database me-2"></i>Datos en vivo</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>ID</th><th>Usuario</th><th>Nombre completo</th><th>Rol</th></tr>
                        </thead>
                        <tbody id="usuariosBody">
                            <tr><td colspan="4" class="text-center py-4">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <footer class="page-footer">
                <i class="bi bi-shield-check me-1"></i> Sistema de control de infracciones
            </footer>
        </main>

        <script src="../js/auth.js"></script>
        <script src="../js/api.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            inicializarSesion();
            solicitarAPI("lista").then(usuarios => {
                document.getElementById("usuariosBody").innerHTML = usuarios.length
                    ? usuarios.map(usuario => `<tr>
                        <td class="id-cell">#${usuario.idUsuario}</td>
                        <td class="fw-semibold">${escaparHTML(usuario.nombreUsuario)}</td>
                        <td>${escaparHTML(usuario.nombreCompleto)}</td>
                        <td><span class="role-badge">${escaparHTML(usuario.rol)}</span></td>
                    </tr>`).join("")
                    : '<tr><td colspan="4" class="text-center py-4">No hay usuarios registrados.</td></tr>';
            }).catch(error => {
                document.getElementById("usuariosBody").innerHTML =
                    '<tr><td colspan="4" class="text-center text-danger py-4">No se pudieron cargar los usuarios.</td></tr>';
                document.getElementById("alerta").innerHTML =
                    `<div class="alert alert-danger">${error.message}</div>`;
            });
        </script>
    </body>
</html>
