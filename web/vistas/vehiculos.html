<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehículos | Infracciones</title>
    <link rel="icon" href="../img/logo.png?v=20261026">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/theme.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container"><a class="navbar-brand fw-semibold" href="dashboard.html">Infracciones</a>
            <div class="session-actions d-flex align-items-center gap-3"><span class="session-user"><span
                        data-nombre-usuario></span></span><button class="btn btn-outline-light btn-sm"
                    data-cerrar-sesion>Salir</button></div>
        </div>
    </nav>
    <main class="container">
        <div class="breadcrumb-label">Panel de administración / <span class="text-dark">Vehículos</span></div>
        <div class="page-heading">
            <div>
                <h1>Vehículos</h1>
                <p>Administra los vehículos asociados al sistema.</p>
            </div><button class="btn btn-primary" id="nuevo">Nuevo vehículo</button>
        </div>
        <div id="alerta"></div>
        <section class="data-panel p-4">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Color</th>
                            <th>Tipo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="../js/auth.js"></script>
    <script>inicializarSesion(); const u = obtenerUsuarioSesion(), r = String(u?.rol || "").toUpperCase(); if (!["ADMIN", "ADMINISTRADOR", "ADMINISTRADOR GENERAL"].includes(r)) location.replace("portal-usuario.html"); let datos = [], tipos = [], edit = null, esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); async function cargar() { let a = await fetch("../webresources/admin/vehiculos"), b = await fetch("../webresources/admin/tipos-vehiculo"), j = await a.json(), k = await b.json(); if (!a.ok || !b.ok) throw Error("No se pudieron cargar los vehículos."); datos = j.vehiculos; tipos = k.tipos; tabla.innerHTML = datos.map(v => `<tr><td>${esc(v.placa)}</td><td>${esc(v.marca)}</td><td>${esc(v.modelo)}</td><td>${esc(v.color)}</td><td>${esc(v.tipo)}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editar(${v.id_vehiculo})">Editar</button><button class="btn btn-sm btn-outline-danger ms-1" onclick="borrar(${v.id_vehiculo})">Eliminar</button></td></tr>`).join("") || '<tr><td colspan="6">No hay vehículos.</td></tr>' } function mostrar() { let v = edit || {}; alerta.innerHTML = `<div class="alert alert-light border"><h2 class="h5">${edit ? "Editar" : "Nuevo"} vehículo</h2><input id="placa" class="form-control mb-2" placeholder="Placa" value="${esc(v.placa)}"><input id="marca" class="form-control mb-2" placeholder="Marca" value="${esc(v.marca)}"><input id="modelo" class="form-control mb-2" placeholder="Modelo" value="${esc(v.modelo)}"><input id="color" class="form-control mb-2" placeholder="Color" value="${esc(v.color)}"><select id="tipo" class="form-select mb-2">${tipos.map(t => `<option value="${t.id_tipo_vehiculo}" ${t.id_tipo_vehiculo == v.id_tipo_vehiculo ? "selected" : ""}>${esc(t.nombre)}</option>`).join("")}</select><button class="btn btn-primary" onclick="guardar()">Guardar</button></div>` } window.editar = id => { edit = datos.find(v => v.id_vehiculo === id); mostrar() }; window.guardar = async () => { let d = { placa: placa.value, marca: marca.value, modelo: modelo.value, color: color.value, idTipoVehiculo: +tipo.value }, x = await fetch("../webresources/admin/vehiculos" + (edit ? "/" + edit.id_vehiculo : ""), { method: edit ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); if (!x.ok) { alerta.innerHTML = '<div class="alert alert-danger">No se pudo guardar.</div>'; return } edit = null; alerta.innerHTML = ""; cargar() }; window.borrar = async id => { if (confirm("¿Eliminar vehículo?")) { await fetch("../webresources/admin/vehiculos/" + id, { method: "DELETE" }); cargar() } }; nuevo.onclick = () => { edit = null; mostrar() }; cargar().catch(e => alerta.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`)</script>
</body>

</html>
